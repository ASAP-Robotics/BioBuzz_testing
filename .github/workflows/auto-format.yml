name: Auto-format Java

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]

jobs:
  google-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # For PRs from forks, checkout the PR's source branch
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check for Java files
        id: check_java
        run: |
          if git ls-files '*.java' | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Google Java Format
        if: steps.check_java.outputs.found == 'true'
        run: |
          wget -q https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar
          java -jar google-java-format-1.25.2-all-deps.jar --replace $(git ls-files '*.java')

      - name: Commit and push formatting changes (non-fork PR)
        if: steps.check_java.outputs.found == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          echo "Formatting changes detected. Committing..."
          git add -u
          git commit -m "Auto-format code"
          git push origin HEAD:${{ github.head_ref }}

      - name: Comment on fork PR about formatting
        if: steps.check_java.outputs.found == 'true' && github.event.pull_request.head.repo.full_name != github.repository && ! git diff --quiet
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ This PR has Java code formatting issues. Please run `google-java-format` locally and push the changes.'
            })
